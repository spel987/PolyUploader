name: Release

# Builds and publishes installers for Windows, Linux and macOS.
# Triggered by pushing a version tag (e.g. v1.7.2) — make sure the version in
# package.json, src-tauri/Cargo.toml and src-tauri/tauri.conf.json matches the tag.
# Can also be run manually from the Actions tab.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# Allow the workflow to create the GitHub release and upload assets.
permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish-tauri:
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS universal binary (Intel + Apple Silicon), unsigned.
          - platform: 'macos-latest'
            args: '--target universal-apple-darwin --bundles app,dmg'
            rust_targets: 'aarch64-apple-darwin,x86_64-apple-darwin'
          # Linux: portable AppImage + Debian/Ubuntu .deb + Fedora/openSUSE .rpm.
          - platform: 'ubuntu-22.04'
            args: '--bundles deb,rpm,appimage'
            rust_targets: ''
          # Windows: NSIS installer.
          - platform: 'windows-latest'
            args: '--bundles nsis'
            rust_targets: ''

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install npm dependencies
        # `npm install` (not `npm ci`) because package-lock.json is gitignored.
        run: npm install

      - name: Build the Tailwind CSS
        run: npm run build:css

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Linux build dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            rpm \
            build-essential \
            libssl-dev \
            file \
            wget \
            curl

      - name: Build and publish the app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Updater signing (minisign). The private key must match the `pubkey`
          # in src-tauri/tauri.conf.json. Configure these as repository secrets.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'PolyUploader v__VERSION__'
          releaseBody: 'Download the installer for your platform from the assets below.'
          releaseDraft: true
          prerelease: false
          # Generates and merges latest.json (updater manifest) across platforms.
          includeUpdaterJson: true
          args: ${{ matrix.args }}
